<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunshine T Academy 🔆 — منصة التدريبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FBBF24;--sun2:#F59E0B;--sun3:#FCD34D;
  --sky:#0EA5E9;--sky2:#0284C7;
  --ok:#16A34A;--bad:#DC2626;--warn:#F59E0B;
  --dark:#0F172A;--darker:#020617;
  --bg:#FFFBEB;--surface:#FFFFFF;--text:#1E293B;--muted:#64748B;--border:#FDE68A;
  --shadow:0 4px 20px rgba(251,191,36,.15);
  --shadow-lg:0 15px 50px rgba(251,191,36,.25);
}
*{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;min-height:100vh;background-image:
  radial-gradient(circle at 10% 10%,rgba(251,191,36,.12),transparent 40%),
  radial-gradient(circle at 90% 90%,rgba(14,165,233,.1),transparent 40%);
  background-attachment:fixed;
}
.screen{display:none;min-height:100vh;padding:20px;animation:fadeIn .5s ease}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ═════ Branding ═════ */
.brand-logo{font-size:3.5rem;line-height:1;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(251,191,36,.5));animation:sunPulse 3s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.08) rotate(8deg)}}
.brand-name{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,var(--sun2),var(--sky));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.brand-slogan{font-size:1rem;color:var(--muted);font-weight:700;margin-top:4px;letter-spacing:2px}
.brand-slogan::before,.brand-slogan::after{content:'✨';margin:0 8px;font-size:.9rem}

/* ═════ Welcome Screen ═════ */
.welcome-box{background:var(--surface);border-radius:28px;padding:48px 40px;max-width:540px;width:100%;box-shadow:var(--shadow-lg);border:3px solid var(--sun3);position:relative;text-align:center}
.welcome-box::before{content:'';position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--sun),var(--sun2));color:white;padding:6px 24px;border-radius:20px;font-weight:900;font-size:.85rem;letter-spacing:1px;box-shadow:0 4px 15px rgba(251,191,36,.4)}
.welcome-title{font-size:1.6rem;font-weight:900;color:var(--text);margin-bottom:8px;margin-top:12px}
.welcome-sub{color:var(--muted);font-size:.95rem;margin-bottom:28px}
.input-group{text-align:right;margin-bottom:20px}
.input-group label{display:block;font-weight:800;margin-bottom:8px;color:var(--text);font-size:.95rem}
.input-group input{width:100%;padding:16px 20px;border:2px solid var(--border);border-radius:16px;font-size:1.05rem;font-family:'Cairo';background:var(--bg);color:var(--text);transition:.2s;font-weight:700}
.input-group input:focus{outline:none;border-color:var(--sun);background:white;box-shadow:0 0 0 4px rgba(251,191,36,.2)}
.btn{border:none;cursor:pointer;border-radius:16px;padding:16px 32px;font-size:1.05rem;font-weight:900;font-family:'Cairo';transition:.25s;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn:hover:not(:disabled){transform:translateY(-3px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--dark);box-shadow:0 8px 24px rgba(251,191,36,.4);width:100%}
.btn-primary:hover:not(:disabled){box-shadow:0 12px 32px rgba(251,191,36,.55)}
.btn-sky{background:linear-gradient(135deg,var(--sky),var(--sky2));color:white;box-shadow:0 8px 24px rgba(14,165,233,.4)}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--sun);color:var(--text)}

/* ═════ Lessons Screen ═════ */
.lessons-container{max-width:1200px;width:100%;padding:20px}
.lessons-header{text-align:center;margin-bottom:36px}
.lessons-header h2{font-size:2rem;font-weight:900;color:var(--text);margin-bottom:8px}
.lessons-header p{color:var(--muted);font-size:1rem}
.lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
@media(max-width:600px){.lessons-grid{grid-template-columns:1fr}}
.lesson-card{background:var(--surface);border-radius:20px;padding:24px 20px;border:2px solid var(--border);cursor:pointer;transition:.3s;position:relative;overflow:hidden;text-align:center}
.lesson-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--sun),var(--sky));transform:scaleX(0);transform-origin:right;transition:transform .3s}
.lesson-card:hover{border-color:var(--sun);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.lesson-card:hover::before{transform:scaleX(1)}
.lesson-num{display:inline-block;background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--dark);font-weight:900;font-size:.75rem;padding:4px 14px;border-radius:20px;margin-bottom:12px;letter-spacing:1px}
.lesson-icon{font-size:2.8rem;margin-bottom:12px;display:block}
.lesson-title{font-weight:900;font-size:1rem;color:var(--text);margin-bottom:6px;line-height:1.4}
.lesson-meta{font-size:.8rem;color:var(--muted);font-weight:700}

/* ═════ Quiz Screen ═════ */
.quiz-container{max-width:820px;width:100%;padding:16px}
.quiz-header{background:var(--surface);border-radius:20px;padding:16px 22px;margin-bottom:20px;box-shadow:var(--shadow);border:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.quiz-header-left{display:flex;align-items:center;gap:14px}
.quiz-header .student-badge{background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--dark);padding:6px 14px;border-radius:12px;font-weight:900;font-size:.85rem}
.quiz-header .lesson-badge{background:var(--sky);color:white;padding:6px 14px;border-radius:12px;font-weight:900;font-size:.85rem}
.quiz-header .progress-badge{background:var(--bg);padding:6px 14px;border-radius:12px;font-weight:900;font-size:.85rem;color:var(--text);border:2px solid var(--border);font-family:'Share Tech Mono'}
.progress-bar{height:8px;background:var(--border);border-radius:20px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sun),var(--sun2),var(--sky));border-radius:20px;transition:width .4s ease;width:0}

.question-card{background:var(--surface);border-radius:24px;padding:32px 28px;box-shadow:var(--shadow);border:2px solid var(--border);margin-bottom:20px;animation:qSlide .4s ease}
@keyframes qSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.q-num{display:inline-block;background:linear-gradient(135deg,var(--sky),var(--sky2));color:white;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;margin-bottom:16px}
.q-topic{display:inline-block;background:var(--bg);color:var(--sun2);font-size:.75rem;font-weight:900;padding:4px 12px;border-radius:20px;margin-right:10px;margin-bottom:16px;border:1px solid var(--border)}
.q-text{font-size:1.15rem;font-weight:800;color:var(--text);margin-bottom:24px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:12px}
.option{background:var(--bg);border:2px solid var(--border);border-radius:16px;padding:16px 18px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px;font-weight:700;color:var(--text);text-align:right}
.option:hover{border-color:var(--sun);background:white;transform:translateX(-4px)}
.option.selected{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(14,165,233,.08));border-color:var(--sun);box-shadow:0 4px 12px rgba(251,191,36,.2)}
.option-letter{background:white;color:var(--text);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;border:2px solid var(--border);transition:.2s}
.option.selected .option-letter{background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--dark);border-color:transparent}

.quiz-nav{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.quiz-nav .btn{flex:1;min-width:120px}

/* ═════ Results Screen ═════ */
.results-container{max-width:900px;width:100%;padding:16px}
.result-hero{background:linear-gradient(135deg,var(--sun2),var(--sun),var(--sky));color:var(--dark);border-radius:28px;padding:36px 28px;text-align:center;margin-bottom:24px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.result-hero::before{content:'🔆';position:absolute;top:-30px;right:-30px;font-size:10rem;opacity:.15;transform:rotate(-15deg)}
.result-hero::after{content:'🌤️';position:absolute;bottom:-30px;left:-30px;font-size:8rem;opacity:.15}
.result-hero-inner{position:relative;z-index:2}
.result-student{font-size:1.1rem;font-weight:900;margin-bottom:4px;opacity:.9}
.result-lesson{font-size:.9rem;font-weight:800;margin-bottom:20px;opacity:.85}
.score-ring{width:160px;height:160px;margin:20px auto;background:white;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(255,255,255,.35),0 15px 40px rgba(0,0,0,.15);position:relative}
.score-ring::before{content:'';position:absolute;inset:-16px;border:4px dashed rgba(255,255,255,.5);border-radius:50%;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.score-num{font-size:3rem;font-weight:900;color:var(--dark);line-height:1}
.score-total{font-size:.9rem;font-weight:800;color:var(--muted);margin-top:4px}
.result-grade{font-size:1.4rem;font-weight:900;margin-top:12px}
.result-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;position:relative;z-index:2}
.stat-badge{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:10px 20px;border-radius:14px;font-weight:900;font-size:.9rem;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px}
.stat-badge.ok{color:var(--ok)}
.stat-badge.bad{color:var(--bad)}
.stat-badge.none{color:var(--muted)}

.review-header{text-align:center;margin:32px 0 20px}
.review-header h2{font-size:1.6rem;font-weight:900;color:var(--text);margin-bottom:6px}
.review-header p{color:var(--muted);font-size:.95rem}

.review-list{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
.review-card{background:var(--surface);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);border:2px solid var(--border);border-right:6px solid var(--muted)}
.review-card.ok{border-right-color:var(--ok)}
.review-card.bad{border-right-color:var(--bad)}
.review-card.none{border-right-color:var(--muted)}
.review-q-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.review-q-num{background:var(--bg);color:var(--text);font-weight:900;padding:4px 12px;border-radius:20px;font-size:.85rem;border:2px solid var(--border)}
.review-q-topic{background:var(--bg);color:var(--sun2);font-weight:900;padding:4px 12px;border-radius:20px;font-size:.75rem;border:1px solid var(--border)}
.review-badge{margin-right:auto;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:900}
.review-badge.ok{background:#DCFCE7;color:#166534}
.review-badge.bad{background:#FEE2E2;color:#991B1B}
.review-badge.none{background:#E2E8F0;color:#475569}
.review-q-text{font-weight:800;font-size:1rem;color:var(--text);margin-bottom:12px;line-height:1.6}
.review-opt{padding:10px 14px;border-radius:10px;margin-bottom:6px;border:2px solid var(--border);background:var(--bg);font-size:.9rem;font-weight:700}
.review-opt.correct{background:#DCFCE7;border-color:var(--ok);color:#166534}
.review-opt.wrong{background:#FEE2E2;border-color:var(--bad);color:#991B1B}
.review-explanation{margin-top:12px;padding:14px 16px;background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(14,165,233,.08));border-radius:12px;border-right:4px solid var(--sun2);font-size:.9rem;color:var(--text);line-height:1.7}
.review-explanation b{color:var(--sun2);font-weight:900}

.result-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:40px}

@media(max-width:600px){
  .welcome-box{padding:36px 24px}
  .brand-logo{font-size:2.8rem}
  .brand-name{font-size:1.5rem}
  .question-card{padding:24px 20px}
  .q-text{font-size:1.05rem}
  .option{padding:14px}
  .score-ring{width:130px;height:130px}
  .score-num{font-size:2.5rem}
}
@media print{
  .no-print{display:none!important}
  body{background:white}
  .screen{padding:0}
  .review-card{break-inside:avoid}
}
</style>
</head>
<body>

<!-- ═════ 1. Welcome ═════ -->
<div class="screen active" id="screen-welcome">
  <div class="welcome-box">
    <div class="brand-logo">🔆</div>
    <div class="brand-name">Sunshine T Academy</div>
    <div class="brand-slogan">بنحول الحلم لكود</div>
    <h1 class="welcome-title" style="margin-top:32px">أهلاً بك في منصة التدريبات</h1>
    <p class="welcome-sub">المستوى الثالث — ESP32 & IoT<br>اختبر نفسك في كل محاضرة بـ 30 سؤالاً</p>
    <div class="input-group">
      <label>👤 اسم الطالب</label>
      <input type="text" id="studentName" placeholder="اكتب اسمك الكامل" autocomplete="off">
    </div>
    <button class="btn btn-primary" onclick="goToLessons()">
      <span>ابدأ الآن</span>
      <span style="font-size:1.3rem">→</span>
    </button>
    <div style="text-align:center;margin-top:20px;font-size:.8rem;color:var(--muted)">
      15 محاضرة • 30 سؤالاً لكل محاضرة • 450 سؤالاً إجمالاً
    </div>
  </div>
</div>

<!-- ═════ 2. Lessons Selection ═════ -->
<div class="screen" id="screen-lessons">
  <div class="lessons-container">
    <div class="lessons-header">
      <div class="brand-logo" style="font-size:2.5rem">🔆</div>
      <h2>اختر المحاضرة</h2>
      <p>أهلاً <b id="lessonsStudentName" style="color:var(--sun2)"></b> — اختر أي محاضرة لبدء التدريب</p>
    </div>
    <div class="lessons-grid" id="lessonsGrid"></div>
  </div>
</div>

<!-- ═════ 3. Quiz ═════ -->
<div class="screen" id="screen-quiz" style="justify-content:flex-start;padding-top:20px">
  <div class="quiz-container">
    <div class="quiz-header">
      <div class="quiz-header-left">
        <span class="student-badge" id="quizStudentName">👤</span>
        <span class="lesson-badge" id="quizLessonName">📚</span>
      </div>
      <div class="progress-badge" id="quizProgress">1 / 30</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quizProgressFill"></div></div>
    <div id="questionArea"></div>
    <div class="quiz-nav">
      <button class="btn btn-ghost" id="prevBtn" onclick="prevQuestion()" disabled>→ السابق</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="max-width:240px">التالي ←</button>
    </div>
  </div>
</div>

<!-- ═════ 4. Results ═════ -->
<div class="screen" id="screen-results" style="justify-content:flex-start;padding-top:20px">
  <div class="results-container" id="resultsContainer"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   SUNSHINE T ACADEMY — QUESTION BANK
   Format: [question, [4 options], correctIndex, explanation]
   ═══════════════════════════════════════════════════ */

const LESSONS = [
{
  id: 1, title: "لقاء العملاق ESP32", icon: "🚀", short: "ESP32 + رادار الشبكات",
  qs: [
    ["ماذا يعني اختصار ESP32؟", ["Espressif Systems Platform 32-bit","Electronic Signal Processor 32","Embedded Smart Processor 320","External Signal Port 32"], 0, "ESP32 هو اسم الشريحة من شركة Espressif Systems بمعمارية 32-bit."],
    ["كم نواة (Core) في معالج ESP32؟", ["1","2 (Dual-Core)","4","8"], 1, "ESP32 له نواتان: Core 0 و Core 1 — يمكنهما تنفيذ مهام متوازية."],
    ["سرعة معالج ESP32 هي:", ["16 MHz","80 MHz","240 MHz","1000 MHz"], 2, "ESP32 يعمل بسرعة 240 MHz — أسرع 15 ضعفاً من Arduino UNO (16 MHz)."],
    ["ذاكرة RAM في ESP32 تساوي:", ["2 KB","32 KB","100 KB","520 KB"], 3, "ESP32 لديه 520 KB RAM — أي أكبر 260 ضعفاً من UNO (2 KB)."],
    ["الجهد المنطقي الذي يعمل به ESP32:", ["5V","3.3V","1.8V","12V"], 1, "ESP32 يعمل بـ 3.3V — لا تدخل 5V على أي GPIO وإلا يحترق!"],
    ["هل ESP32 يحتوي WiFi مدمج؟", ["نعم مدمج في الشريحة","لا يحتاج وحدة خارجية","نعم لكن يحتاج راوتر خارجي","لا يوجد WiFi"], 0, "WiFi و Bluetooth مدمجان داخل الشريحة نفسها — لا حاجة لوحدات خارجية."],
    ["ما معنى Dual-Core في ESP32؟", ["معالجان يعملان بالتوازي","ذاكرتان","شاشتان","بطاريتان"], 0, "Dual-Core = نواتان مستقلتان يمكنهما تنفيذ مهام مختلفة في نفس الوقت."],
    ["أي مجموعة ADC تعمل مع WiFi دون تعارض؟", ["ADC1 (GPIO 32-39)","ADC2","كلتاهما","لا يعمل أي ADC"], 0, "ADC1 آمنة للاستخدام مع WiFi. ADC2 تتعارض مع WiFi وتفشل القراءات."],
    ["ما الدالة التي تمسح شبكات WiFi القريبة؟", ["WiFi.find()","WiFi.scanNetworks()","WiFi.list()","WiFi.search()"], 1, "scanNetworks() ترجع عدد الشبكات المكتشفة ويمكن قراءة أسمائها وقوتها."],
    ["قيمة RSSI الأقوى هي:", ["-100 dBm","-85 dBm","-35 dBm (الأقرب للصفر)","0 dBm"], 2, "RSSI قيمة سالبة — كلما اقتربت من الصفر كانت الإشارة أقوى (الأفضل -30 إلى -50)."],
    ["ما الذي تعنيه كلمة Strapping Pins؟", ["أطراف عادية","أطراف تُستخدم عند الإقلاع — تجنبها كمدخلات","أطراف للطاقة فقط","أطراف للشاشة"], 1, "Strapping Pins مثل GPIO 0, 2, 12, 15 تُستخدم عند boot — لا تستخدمها كمدخلات."],
    ["ما وظيفة زر BOOT في ESP32؟", ["إعادة التشغيل","الدخول لوضع البرمجة","إطفاء الجهاز","تشغيل WiFi"], 1, "BOOT يُستخدم للدخول لوضع تحميل الكود — مفيد لو فشل الرفع التلقائي."],
    ["أي طرف GPIO يستخدم عادة للـ LED المدمج في ESP32؟", ["GPIO 13","GPIO 5","GPIO 2","GPIO 34"], 2, "GPIO 2 هو الطرف المتصل بالـ LED المدمج (أزرق عادة) في معظم لوحات ESP32."],
    ["ما الفرق الأهم بين ESP32 و Arduino UNO؟", ["ESP32 به WiFi + BLE مدمجان + Dual-Core","ESP32 أرخص فقط","ESP32 بدون WiFi","لا فرق"], 0, "ESP32 يجمع قوة معالجة أعلى + اتصالات مدمجة بسعر أقل."],
    ["ما وظيفة WiFi.mode(WIFI_STA)؟", ["جعل ESP32 نقطة وصول","جعل ESP32 جهازاً يتصل بشبكة","إيقاف WiFi","إعادة تشغيل WiFi"], 1, "STA (Station) = ESP32 يتصرف كموبايل — يتصل بشبكة موجودة."],
    ["Dual-Core في ESP32 يعني أن المعالج:", ["يعمل بسرعة مضاعفة","يمكنه تنفيذ مهمتين في نفس الوقت","لا يوجد تبريد","يحتاج طاقة أعلى فقط"], 1, "نواتان مستقلتان = توازي حقيقي في المهام."],
    ["ما أقصى جهد يمكن أن يتحمله طرف ADC في ESP32؟", ["5V","3.3V","1.8V","12V"], 1, "ADC يقيس من 0 إلى 3.3V — أعلى من ذلك يتلف الشريحة."],

/* ═══════════════════════════════════════════════════
   STATE MANAGEMENT
   ═══════════════════════════════════════════════════ */
let studentName = "";
let currentLesson = null;
let currentQIndex = 0;
let userAnswers = [];
let startTime = null;

/* ═══════════════════════════════════════════════════
   SCREEN NAVIGATION
   ═══════════════════════════════════════════════════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ═══════════════════════════════════════════════════
   WELCOME → LESSONS
   ═══════════════════════════════════════════════════ */
function goToLessons(){
  const name = document.getElementById('studentName').value.trim();
  if(!name){ alert('⚠️ من فضلك اكتب اسمك أولاً'); return; }
  if(name.length < 2){ alert('⚠️ الاسم قصير جداً'); return; }
  studentName = name;
  document.getElementById('lessonsStudentName').textContent = studentName;
  renderLessons();
  showScreen('screen-lessons');
}

function renderLessons(){
  const grid = document.getElementById('lessonsGrid');
  grid.innerHTML = LESSONS.map(l=>`
    <div class="lesson-card" onclick="startLesson(${l.id})">
      <span class="lesson-num">المحاضرة ${String(l.id).padStart(2,'0')}</span>
      <span class="lesson-icon">${l.icon}</span>
      <div class="lesson-title">${l.title}</div>
      <div class="lesson-meta">${l.short}</div>
      <div class="lesson-meta" style="margin-top:6px;color:var(--sun2)">📝 30 سؤالاً</div>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════════════
   START LESSON
   ═══════════════════════════════════════════════════ */
function startLesson(lessonId){
  currentLesson = LESSONS.find(l=>l.id === lessonId);
  if(!currentLesson) return;
  currentQIndex = 0;
  userAnswers = new Array(currentLesson.qs.length).fill(null);
  startTime = Date.now();

  document.getElementById('quizStudentName').textContent = '👤 ' + studentName;
  document.getElementById('quizLessonName').textContent = currentLesson.icon + ' ' + currentLesson.title;
  renderQuestion();
  showScreen('screen-quiz');
}

/* ═══════════════════════════════════════════════════
   RENDER QUESTION
   ═══════════════════════════════════════════════════ */
function renderQuestion(){
  const q = currentLesson.qs[currentQIndex];
  const total = currentLesson.qs.length;
  const letters = ['أ','ب','ج','د'];

  // Progress
  document.getElementById('quizProgress').textContent = `${currentQIndex + 1} / ${total}`;
  document.getElementById('quizProgressFill').style.width = `${((currentQIndex + 1) / total) * 100}%`;

  // Question
  const area = document.getElementById('questionArea');
  area.innerHTML = `
    <div class="question-card">
      <div>
        <span class="q-num">${currentQIndex + 1}</span>
        <span class="q-topic">${currentLesson.title}</span>
      </div>
      <p class="q-text">${q[0]}</p>
      <div class="options">
        ${q[1].map((opt, i)=>`
          <div class="option ${userAnswers[currentQIndex] === i ? 'selected' : ''}" onclick="selectOption(${i})">
            <span class="option-letter">${letters[i]}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Nav buttons
  document.getElementById('prevBtn').disabled = currentQIndex === 0;
  const nextBtn = document.getElementById('nextBtn');
  if(currentQIndex === total - 1){
    nextBtn.textContent = '🏁 إظهار النتيجة';
    nextBtn.style.background = 'linear-gradient(135deg,var(--ok),#059669)';
    nextBtn.style.color = 'white';
  } else {
    nextBtn.textContent = 'التالي ←';
    nextBtn.style.background = '';
    nextBtn.style.color = '';
  }
}

function selectOption(idx){
  userAnswers[currentQIndex] = idx;
  renderQuestion();
}

function prevQuestion(){
  if(currentQIndex > 0){
    currentQIndex--;
    renderQuestion();
  }
}

function nextQuestion(){
  if(userAnswers[currentQIndex] === null){
    if(!confirm('لم تختر إجابة. هل تريد المتابعة بدون إجابة؟')) return;
  }
  if(currentQIndex < currentLesson.qs.length - 1){
    currentQIndex++;
    renderQuestion();
  } else {
    if(confirm('🎯 هل أنت جاهز لرؤية النتيجة؟')){
      showResults();
    }
  }
}

/* ═══════════════════════════════════════════════════
   RESULTS SCREEN
   ═══════════════════════════════════════════════════ */
function showResults(){
  const total = currentLesson.qs.length;
  let ok = 0, bad = 0, none = 0;

  currentLesson.qs.forEach((q, i)=>{
    if(userAnswers[i] === null) none++;
    else if(userAnswers[i] === q[2]) ok++;
    else bad++;
  });

  const duration = Math.round((Date.now() - startTime) / 1000);
  const mins = Math.floor(duration / 60);
  const secs = duration % 60;

  const scorePct = Math.round((ok / total) * 100);
  let grade = '', gradeEmoji = '';
  if(scorePct >= 90){ grade = 'ممتاز — أنت مهندس حقيقي!'; gradeEmoji = '🏆'; }
  else if(scorePct >= 80){ grade = 'جيد جداً — أداء رائع'; gradeEmoji = '🌟'; }
  else if(scorePct >= 70){ grade = 'جيد — استمر في التقدم'; gradeEmoji = '👍'; }
  else if(scorePct >= 60){ grade = 'ناجح — راجع النقاط الضعيفة'; gradeEmoji = '✅'; }
  else { grade = 'يحتاج مراجعة — لا تستسلم!'; gradeEmoji = '📚'; }

  const letters = ['أ','ب','ج','د'];

  const html = `
    <div class="result-hero">
      <div class="result-hero-inner">
        <div style="font-size:2.5rem">🔆</div>
        <div class="result-student">${studentName}</div>
        <div class="result-lesson">${currentLesson.icon} ${currentLesson.title}</div>
        <div class="score-ring">
          <div class="score-num">${ok}</div>
          <div class="score-total">من ${total}</div>
        </div>
        <div class="result-grade">${gradeEmoji} ${grade}</div>
        <div class="result-stats">
          <div class="stat-badge ok">✅ صحيح: ${ok}</div>
          <div class="stat-badge bad">❌ خطأ: ${bad}</div>
          <div class="stat-badge none">⬜ متروك: ${none}</div>
        </div>
        <div style="margin-top:16px;font-size:.85rem;opacity:.85;font-weight:800">
          ⏱️ الوقت: ${mins} دقيقة و ${secs} ثانية • 📊 النسبة: ${scorePct}%
        </div>
      </div>
    </div>

    <div class="result-actions no-print">
      <button class="btn btn-primary" onclick="window.print()" style="max-width:220px">🖨️ طباعة / PDF</button>
      <button class="btn btn-sky" onclick="showScreen('screen-lessons')" style="max-width:220px">📚 محاضرة أخرى</button>
      <button class="btn btn-ghost" onclick="location.reload()" style="max-width:180px">🔄 من جديد</button>
    </div>

    <div class="review-header">
      <h2>📖 مراجعة الإجابات الكاملة</h2>
      <p>راجع كل سؤال — الإجابة الصحيحة والشرح</p>
    </div>

    <div class="review-list">
      ${currentLesson.qs.map((q, i)=>{
        const ua = userAnswers[i];
        const isCorrect = ua === q[2];
        const statusClass = ua === null ? 'none' : isCorrect ? 'ok' : 'bad';
        const statusText = ua === null ? '⬜ متروك' : isCorrect ? '✅ صحيح' : '❌ خطأ';
        return `
          <div class="review-card ${statusClass}">
            <div class="review-q-head">
              <span class="review-q-num">السؤال ${i + 1}</span>
              <span class="review-q-topic">${currentLesson.title}</span>
              <span class="review-badge ${statusClass}">${statusText}</span>
            </div>
            <div class="review-q-text">${q[0]}</div>
            ${q[1].map((opt, j)=>{
              const isCorrectOpt = j === q[2];
              const isUserChoice = j === ua;
              let cls = 'review-opt';
              if(isCorrectOpt) cls += ' correct';
              else if(isUserChoice) cls += ' wrong';
              let suffix = '';
              if(isCorrectOpt && isUserChoice) suffix = ' ✅ (إجابتك — صحيحة)';
              else if(isCorrectOpt) suffix = ' ✅ (الإجابة الصحيحة)';
              else if(isUserChoice) suffix = ' ❌ (إجابتك — خاطئة)';
              return `<div class="${cls}">${letters[j]}) ${opt}${suffix}</div>`;
            }).join('')}
            <div class="review-explanation">
              <b>💡 الشرح:</b> ${q[3]}
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <div style="text-align:center;padding:20px;color:var(--muted);font-size:.9rem;margin-bottom:40px">
      <div style="font-size:1.5rem;margin-bottom:8px">🔆</div>
      <b>Sunshine T Academy</b> — بنحول الحلم لكود
    </div>
  `;

  document.getElementById('resultsContainer').innerHTML = html;
  showScreen('screen-results');
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('screen-quiz').classList.contains('active')){
    if(e.key === 'ArrowLeft') nextQuestion();
    else if(e.key === 'ArrowRight') prevQuestion();
    else if(e.key >= '1' && e.key <= '4') selectOption(parseInt(e.key) - 1);
  }
});

document.getElementById('studentName').addEventListener('keypress', (e)=>{
  if(e.key === 'Enter') goToLessons();
});
</script>
</body>
</html>
